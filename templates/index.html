<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Position Hedging Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d1a;
    --sidebar-bg: #13131f;
    --card-bg: #1a1a2e;
    --border: #2a2a42;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --text: #e2e8f0;
    --text-muted: #8892a4;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #eab308;
    --input-bg: #0f0f1e;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 13px;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Scrollbar ─────────────────────────────────────── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Sidebar ────────────────────────────────────────── */
  .sidebar {
    width: 230px;
    min-width: 230px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 16px 12px;
    gap: 14px;
  }

  .sidebar-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: .3px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .field-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  .field-group { display: flex; flex-direction: column; }

  input[type="text"], input[type="date"], select {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    padding: 7px 10px;
    width: 100%;
    outline: none;
    transition: border-color .15s;
  }
  input[type="text"]:focus,
  input[type="date"]:focus,
  select:focus { border-color: var(--accent); }
  select option { background: #1a1a2e; }

  /* Number picker with +/- */
  .num-picker {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .num-picker input {
    flex: 1;
    text-align: center;
  }
  .num-btn {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    width: 28px;
    height: 28px;
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
    flex-shrink: 0;
  }
  .num-btn:hover { background: var(--accent); }

  /* Position card */
  .pos-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .pos-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    cursor: pointer;
    user-select: none;
    background: rgba(99,102,241,.08);
  }
  .pos-card-header:hover { background: rgba(99,102,241,.15); }
  .pos-card-title { font-weight: 600; color: var(--accent); font-size: 12px; }
  .pos-card-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .chevron { transition: transform .2s; font-size: 10px; color: var(--text-muted); }
  .chevron.open { transform: rotate(180deg); }

  /* Checkbox */
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .checkbox-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* Analyze button */
  .btn-analyze {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 10px;
    cursor: pointer;
    width: 100%;
    transition: background .15s, transform .1s;
    letter-spacing: .3px;
  }
  .btn-analyze:hover { background: var(--accent-hover); }
  .btn-analyze:active { transform: scale(.98); }
  .btn-analyze:disabled { opacity: .5; cursor: not-allowed; }

  /* ── Main content ───────────────────────────────────── */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .page-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }
  .badge {
    background: rgba(99,102,241,.15);
    border: 1px solid rgba(99,102,241,.3);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 11px;
    color: var(--accent);
  }

  /* Cards */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  /* Stats row */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
  }
  .stat-card {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
  .stat-value { font-size: 18px; font-weight: 700; margin-top: 4px; }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead th {
    background: rgba(255,255,255,.03);
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .5px;
    padding: 9px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:hover { background: rgba(255,255,255,.03); }
  tbody td { padding: 10px 14px; white-space: nowrap; }
  .idx-cell { color: var(--text-muted); width: 36px; }
  .pl-positive { color: var(--green); font-weight: 600; }
  .pl-negative { color: var(--red); font-weight: 600; }
  .pl-cell-highlight { background: rgba(239,68,68,.12); }

  /* Chart area */
  .chart-container { position: relative; height: 360px; }

  /* Loading/error */
  .status-msg {
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
    font-size: 14px;
  }
  .status-msg.error { color: var(--red); }

  .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .vol-chip {
    font-size: 11px;
    background: rgba(234,179,8,.1);
    border: 1px solid rgba(234,179,8,.3);
    color: var(--yellow);
    border-radius: 4px;
    padding: 2px 8px;
  }

  /* Divider */
  hr { border: none; border-top: 1px solid var(--border); }
</style>
</head>
<body>

<!-- ═══════════════ SIDEBAR ═══════════════ -->
<aside class="sidebar">
  <div class="sidebar-title">⬡ Position Hedger</div>

  <!-- Ticker -->
  <div class="field-group">
    <div class="field-label">Ticker Symbol</div>
    <input type="text" id="ticker" value="AAPL" placeholder="e.g. AAPL" maxlength="10"
           style="text-transform:uppercase" />
  </div>

  <!-- Number of option positions -->
  <div class="field-group">
    <div class="field-label">Number of Option Positions</div>
    <div class="num-picker">
      <button class="num-btn" onclick="changeCount(-1)">−</button>
      <input type="text" id="posCount" value="2" readonly style="cursor:default" />
      <button class="num-btn" onclick="changeCount(1)">+</button>
    </div>
  </div>

  <!-- Dynamic position cards -->
  <div id="positionCards"></div>

  <hr />

  <!-- Include stock -->
  <label class="checkbox-row">
    <input type="checkbox" id="includeStock" checked />
    Include Stock Position
  </label>

  <!-- Analyze -->
  <button class="btn-analyze" id="analyzeBtn" onclick="analyze()">Analyze</button>
</aside>

<!-- ═══════════════ MAIN ═══════════════ -->
<main class="main">
  <div class="header-row">
    <div class="page-title">Position Details</div>
    <span class="badge" id="tickerBadge">—</span>
  </div>

  <!-- Summary stats -->
  <div class="stats-row" id="statsRow" style="display:none">
    <div class="stat-card">
      <div class="stat-label">Current Price</div>
      <div class="stat-value" id="statPrice">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Impl. Volatility</div>
      <div class="stat-value" style="color:var(--yellow)" id="statVol">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total P/L</div>
      <div class="stat-value" id="statPL">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Positions</div>
      <div class="stat-value" id="statPositions">—</div>
    </div>
  </div>

  <!-- Position table -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">Positions</div>
    </div>
    <div id="tableArea" class="status-msg">
      Configure positions in the sidebar and click <strong>Analyze</strong>.
    </div>
  </div>

  <!-- Chart -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">Price Charts</div>
      <span style="color:var(--text-muted);font-size:12px">Stock vs Option Price Comparison</span>
    </div>
    <div id="chartArea" class="chart-container">
      <div class="status-msg">No data yet.</div>
    </div>
  </div>
</main>

<script>
// ═══════════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════════
let posCount = 2;
let priceChart = null;

// ═══════════════════════════════════════════════════
//  Position count
// ═══════════════════════════════════════════════════
function changeCount(delta) {
  posCount = Math.max(1, Math.min(5, posCount + delta));
  document.getElementById('posCount').value = posCount;
  renderPositionCards();
}

function renderPositionCards() {
  const container = document.getElementById('positionCards');
  // Keep existing values
  const existing = {};
  container.querySelectorAll('.pos-card').forEach(card => {
    const i = card.dataset.index;
    existing[i] = {
      expiry: card.querySelector('.f-expiry').value,
      strike: card.querySelector('.f-strike').value,
      type:   card.querySelector('.f-type').value,
      order:  card.querySelector('.f-order').value,
    };
  });

  container.innerHTML = '';
  for (let i = 1; i <= posCount; i++) {
    const prev = existing[i] || {};
    // Default expiry ~30 days out
    const d = new Date(); d.setDate(d.getDate() + 30);
    const defExpiry = prev.expiry || d.toISOString().slice(0,10);
    const defStrike = prev.strike || '100.00';
    const defType   = prev.type   || (i % 2 === 1 ? 'call' : 'put');
    const defOrder  = prev.order  || (i % 2 === 1 ? 'sell' : 'buy');

    const card = document.createElement('div');
    card.className = 'pos-card';
    card.dataset.index = i;
    card.innerHTML = `
      <div class="pos-card-header" onclick="toggleCard(this)">
        <span class="pos-card-title">Option Position ${i}</span>
        <span class="chevron open">▼</span>
      </div>
      <div class="pos-card-body">
        <div class="field-group">
          <div class="field-label">Expiry Date ${i}</div>
          <input type="date" class="f-expiry" value="${defExpiry}" />
        </div>
        <div class="field-group">
          <div class="field-label">Strike Price ${i}</div>
          <div class="num-picker">
            <button class="num-btn" onclick="adjustStrike(this,-1)">−</button>
            <input type="text" class="f-strike" value="${defStrike}" />
            <button class="num-btn" onclick="adjustStrike(this,1)">+</button>
          </div>
        </div>
        <div class="field-group">
          <div class="field-label">Option Type ${i}</div>
          <select class="f-type">
            <option value="call" ${defType==='call'?'selected':''}>Call</option>
            <option value="put"  ${defType==='put' ?'selected':''}>Put</option>
          </select>
        </div>
        <div class="field-group">
          <div class="field-label">Order Type ${i}</div>
          <select class="f-order">
            <option value="buy"  ${defOrder==='buy' ?'selected':''}>Buy</option>
            <option value="sell" ${defOrder==='sell'?'selected':''}>Sell</option>
          </select>
        </div>
      </div>`;
    container.appendChild(card);
  }
}

function toggleCard(header) {
  const body = header.nextElementSibling;
  const chev = header.querySelector('.chevron');
  if (body.style.display === 'none') {
    body.style.display = 'flex';
    chev.classList.add('open');
  } else {
    body.style.display = 'none';
    chev.classList.remove('open');
  }
}

function adjustStrike(btn, delta) {
  const input = btn.parentElement.querySelector('.f-strike');
  const val = parseFloat(input.value) || 0;
  input.value = Math.max(0, val + delta).toFixed(2);
}

// ═══════════════════════════════════════════════════
//  Collect form data
// ═══════════════════════════════════════════════════
function getPayload() {
  const ticker = document.getElementById('ticker').value.trim().toUpperCase() || 'AAPL';
  const include_stock = document.getElementById('includeStock').checked;

  const positions = [];
  document.querySelectorAll('.pos-card').forEach(card => {
    const expiry = card.querySelector('.f-expiry').value.replace(/-/g, '/');
    const strike = parseFloat(card.querySelector('.f-strike').value) || 100;
    const type   = card.querySelector('.f-type').value;
    const order  = card.querySelector('.f-order').value;
    if (expiry) positions.push({ expiry, strike, type, order });
  });

  return { ticker, include_stock, positions };
}

// ═══════════════════════════════════════════════════
//  Analyze
// ═══════════════════════════════════════════════════
async function analyze() {
  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Analyzing…';

  setTableLoading();

  try {
    const payload = getPayload();
    const resp = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await resp.json();
    if (!resp.ok || data.error) throw new Error(data.error || 'Request failed');
    renderResults(data);
  } catch (err) {
    showError(err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Analyze';
  }
}

// ═══════════════════════════════════════════════════
//  Render results
// ═══════════════════════════════════════════════════
function renderResults(data) {
  const { positions, stock_historical, option_historical, current_price, ticker, volatility } = data;

  // Badge + stats
  document.getElementById('tickerBadge').textContent = ticker;
  document.getElementById('statsRow').style.display = 'grid';
  document.getElementById('statPrice').textContent = `$${current_price.toFixed(2)}`;
  document.getElementById('statVol').textContent = `${volatility}%`;

  const totalPL = positions.reduce((s, p) => s + (typeof p.pl === 'number' ? p.pl : 0), 0);
  const plEl = document.getElementById('statPL');
  plEl.textContent = formatCurrency(totalPL);
  plEl.className = 'stat-value ' + (totalPL >= 0 ? 'green' : 'red');
  document.getElementById('statPositions').textContent = positions.length;

  // Table
  renderTable(positions);

  // Chart
  renderChart(stock_historical, option_historical, ticker);
}

function renderTable(positions) {
  if (!positions.length) {
    document.getElementById('tableArea').innerHTML = '<div class="status-msg">No positions.</div>';
    return;
  }

  let html = `<div class="table-wrap"><table>
    <thead><tr>
      <th style="width:36px"></th>
      <th>Position</th>
      <th>Entry Price</th>
      <th>Exit Price</th>
      <th>P/L</th>
      <th>Max Profit</th>
      <th>Max Loss</th>
    </tr></thead><tbody>`;

  positions.forEach((pos, idx) => {
    const pl = pos.pl;
    const plClass = pl >= 0 ? 'pl-positive' : 'pl-negative';
    const rowHighlight = pl < 0 ? 'pl-cell-highlight' : '';
    html += `<tr>
      <td class="idx-cell">${idx}</td>
      <td>${pos.position}</td>
      <td>$${pos.entry_price.toFixed(2)}</td>
      <td>$${pos.exit_price.toFixed(2)}</td>
      <td class="${plClass} ${rowHighlight}">${formatCurrency(pl)}</td>
      <td class="pl-positive">${formatVal(pos.max_profit)}</td>
      <td class="pl-negative">${formatVal(pos.max_loss)}</td>
    </tr>`;
  });

  html += '</tbody></table></div>';
  document.getElementById('tableArea').innerHTML = html;
}

function formatCurrency(v) {
  if (typeof v !== 'number') return v;
  return (v >= 0 ? '$' : '-$') + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatVal(v) {
  if (v === 'Unlimited') return '∞ Unlimited';
  return formatCurrency(v);
}

// ═══════════════════════════════════════════════════
//  Chart
// ═══════════════════════════════════════════════════
const COLORS = ['#6366f1', '#f43f5e', '#22c55e', '#f59e0b', '#38bdf8', '#a78bfa'];
const DASHES = [[], [6,3], [3,3], [8,3,2,3]];

function renderChart(stockHist, optionHist, ticker) {
  const area = document.getElementById('chartArea');
  area.innerHTML = '<canvas id="priceChart"></canvas>';

  const labels = stockHist.map(d => d.date);
  const datasets = [];

  // Stock price (left axis)
  datasets.push({
    label: `Stock Price`,
    data: stockHist.map(d => d.price),
    borderColor: '#6366f1',
    backgroundColor: 'rgba(99,102,241,.08)',
    fill: false,
    tension: 0.3,
    pointRadius: 0,
    borderWidth: 2,
    yAxisID: 'yStock',
  });

  // Option prices (right axis)
  const optKeys = Object.keys(optionHist);
  optKeys.forEach((key, i) => {
    const color = COLORS[(i + 1) % COLORS.length];
    datasets.push({
      label: key,
      data: optionHist[key].map(d => d.price),
      borderColor: color,
      backgroundColor: 'transparent',
      fill: false,
      tension: 0.3,
      pointRadius: 0,
      borderWidth: 1.5,
      borderDash: DASHES[i % DASHES.length],
      yAxisID: 'yOption',
    });
  });

  if (priceChart) { priceChart.destroy(); priceChart = null; }

  const ctx = document.getElementById('priceChart').getContext('2d');
  priceChart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          position: 'right',
          labels: {
            color: '#94a3b8',
            boxWidth: 12,
            font: { size: 11 },
            usePointStyle: true,
            pointStyleWidth: 14,
          },
        },
        tooltip: {
          backgroundColor: '#1e1e30',
          borderColor: '#2a2a42',
          borderWidth: 1,
          titleColor: '#e2e8f0',
          bodyColor: '#94a3b8',
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: $${ctx.parsed.y.toFixed(2)}`,
          },
        },
      },
      scales: {
        x: {
          ticks: { color: '#64748b', maxTicksLimit: 12, font: { size: 10 } },
          grid: { color: 'rgba(255,255,255,.04)' },
        },
        yStock: {
          type: 'linear',
          position: 'left',
          ticks: { color: '#94a3b8', font: { size: 11 }, callback: v => `$${v}` },
          grid: { color: 'rgba(255,255,255,.05)' },
          title: { display: true, text: 'Stock Price ($)', color: '#94a3b8', font: { size: 11 } },
        },
        yOption: {
          type: 'linear',
          position: 'right',
          ticks: { color: '#f43f5e', font: { size: 11 }, callback: v => `$${v}` },
          grid: { drawOnChartArea: false },
          title: { display: true, text: 'Option Price ($)', color: '#f43f5e', font: { size: 11 } },
        },
      },
    },
  });
}

// ═══════════════════════════════════════════════════
//  Helpers
// ═══════════════════════════════════════════════════
function setTableLoading() {
  document.getElementById('tableArea').innerHTML =
    '<div class="status-msg"><span class="spinner"></span> Fetching data…</div>';
  document.getElementById('chartArea').innerHTML =
    '<div class="status-msg"><span class="spinner"></span> Building chart…</div>';
  document.getElementById('statsRow').style.display = 'none';
}

function showError(msg) {
  document.getElementById('tableArea').innerHTML =
    `<div class="status-msg error">Error: ${msg}</div>`;
  document.getElementById('chartArea').innerHTML =
    '<div class="status-msg">—</div>';
}

// ═══════════════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  renderPositionCards();

  // Auto-fill strike from ticker price on load
  document.getElementById('ticker').addEventListener('blur', async function () {
    const t = this.value.trim().toUpperCase();
    if (!t) return;
    try {
      const res = await fetch(`/api/stock/${t}`);
      const data = await res.json();
      if (data.current_price) {
        const p = data.current_price;
        document.querySelectorAll('.f-strike').forEach((el, i) => {
          // Round to nearest 5, offset calls up / puts down
          const offset = (i % 2 === 0) ? 5 : -5;
          el.value = (Math.round((p + offset) / 5) * 5).toFixed(2);
        });
      }
    } catch (_) {}
  });
});
</script>
</body>
</html>
